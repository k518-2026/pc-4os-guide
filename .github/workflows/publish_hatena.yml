name: Daily PC 4OS Guide Publisher to Hatena Blog

concurrency:
  group: pc-4os-guide-hatena-publish
  cancel-in-progress: false

on:
  schedule:
    # 4時間ごとに起動し、--min-interval-hours 16 により前回投稿から16時間経過していれば1記事をはてなブログへ自動投稿
    - cron: '17 */4 * * *'

  push:
    branches:
      - main
    paths:
      - '.trigger_publish'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (Simulate without sending email or committing history)'
        required: true
        type: boolean
        default: false
      article_id:
        description: 'Specific article ID (optional, e.g. art01-pdf-merge-split-compress)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force post even if already posted today or previously posted'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-hatena:
    name: Dispatch Stocked 4OS Article to Hatena Blog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests -v

      - name: Send Next Stocked Article to Hatena Blog
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || '' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          HATENA_POST_EMAIL: ${{ secrets.HATENA_POST_EMAIL }}
          ATTACH_IMAGE_HATENA: 'true'
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_ARTICLE_ID: ${{ github.event.inputs.article_id }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          git pull --rebase origin main || true
          ARGS="--post-hatena --preview-html --min-interval-hours 16"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$INPUT_ARTICLE_ID" ]; then
            ARGS="$ARGS --article-id $INPUT_ARTICLE_ID"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          elif [ "${{ github.event_name }}" = "push" ] && grep -q "force=true" .trigger_publish 2>/dev/null; then
            ARGS="$ARGS --force"
          fi
          python -m src.main $ARGS

      - name: Upload Hatena HTML Preview Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatena-post-preview-html
          path: preview_hatena.html
          if-no-files-found: ignore

      - name: Commit & Push Updated Hatena Post History
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_hatena.json
          if git diff --staged --quiet; then
            echo "No history updates to commit."
          else
            git commit -m "chore(hatena): Record daily Hatena Blog email post history [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 3
            done
          fi
